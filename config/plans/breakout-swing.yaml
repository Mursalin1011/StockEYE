# Trade lab plan (docs/06-trade-lab-plan.md). Run:
#   .\.venv\Scripts\python.exe -m dse_screener simulate PTL --plan breakout-swing --from 2025-01-01
# Any value can be overridden on the command line (see `simulate --help`).
name: breakout-swing
description: Base breakouts with the swing profile's settings, a stop and a trailing MA20.
codes: [PTL]

entry:
  strategy: base_breakout
  profile: swing             # use the swing profile's base_breakout parameters
  fill: next_open

exit:
  stop_pct: 8                # intraday low 8% below the entry
  trail_ma: 20               # close below MA20
  max_days: 60

hold:
  min_days: 2                # settlement: shares can be sold from entry day + 2
  cooldown_days: 0

costs: { round_trip_pct: 1.0 }
capital: { start: 100000, per_trade_pct: 100 }
in_sample_until: 2025-12-31  # stats split: 2025 = tuning, 2026 = test

# Trade lab plan (docs/06-trade-lab-plan.md §13): 10/20 cross inside an uptrend, with volume support.
# Kept for comparison: on the 2-year check it has no edge over the basket (whipsaws, 1% cost per round trip).
name: ma-cross-fast
description: MA10 crosses above MA20 while MA20 > MA50 and close > MA50, 10-day volume above its 50-day average; sell when MA10 < MA20.
codes: [PTL]

entry:
  when:
    - sma_10 crosses_above sma_20
    - sma_20 > sma_50
    - close > sma_50
    - avg_vol_10 > avg_vol_50
  fill: next_open
  new_signal_only: true

exit:
  when_any:
    - sma_10 < sma_20
  max_days: 120

hold:
  min_days: 2
  cooldown_days: 0

costs: { round_trip_pct: 1.0 }
capital: { start: 100000, per_trade_pct: 100 }
in_sample_until: 2025-12-31

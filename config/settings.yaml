# Global settings. Strategy and filter numbers live in config/profiles/*.yaml.

timezone: Asia/Dhaka

paths:
  db: data/dse.sqlite
  raw: data/raw            # gzipped copies of every downloaded page, so data can be re-parsed later

http:
  user_agent: "Mozilla/5.0 (compatible; dse-screener/0.1; personal research)"
  timeout_s: 120
  delay_s: 2.0             # pause between requests, be polite to DSE
  retries: 3

sources:
  dse_archive:
    base_url: https://old.dsebd.org/day_end_archive.php
  dse_company:
    base_url: https://old.dsebd.org/displayCompany.php
  dse_news:
    base_url: https://old.dsebd.org/old_news.php
  dse_market:                # official day totals (incl. block trades) + breadth, latest day only
    base_url: https://old.dsebd.org/market-statistics.php
  dse_market_summary:        # official day totals + DSEX/DS30 per day, last ~2 years
    base_url: https://www.dse.com.bd/api/live/data-archive/market-summary

ingest:
  backfill_years: 2        # DSE archive keeps a rolling ~2-year window
  chunk_days: 31           # one request per chunk (all instruments)
  min_rows_per_day: 300    # fewer rows than this = day's data treated as incomplete

daily:
  # The `daily` job: wait for today's data -> refresh news -> screen all profiles -> Telegram.
  trading_weekdays: [Sun, Mon, Tue, Wed, Thu]
  not_before: "14:45"          # market closes 14:30; the archive publishes day-end data after that
  retry_every_min: 5           # data not there yet -> try again
  give_up_at: "16:30"          # still nothing -> holiday or outage, send a short notice
  refresh_news: true           # daily, for stocks passing a quality filter (record dates, news lines)
  refresh_company_pages_every_days: 7   # category, dividends, shareholding change slowly
  company_pages_per_day: 60    # spread over the week so the 3pm job stays fast (stalest first)

report:
  profiles: [swing, position, trend]  # which profiles run daily, in this order
  news_lookback_days: 14       # news shown under each pick
  max_news_per_pick: 2
  max_reasons_per_pick: 4

telegram:
  enabled: true
  # bot_token and chat_id live in config/secrets.yaml (git-ignored), see secrets.example.yaml

holdings:
  # Your positions: mark them in Telegram (/bought PTL 53.7 500, /sold PTL 60, /stop PTL 48, /holdings, /undo).
  # Run `python -m dse_screener bot` (or scripts/register_bot_task.ps1) so the bot answers right away;
  # the 3pm job also picks up messages, but Telegram only keeps unread messages for 24 hours.
  default_stop_pct: 8          # stop below your average cost when you didn't give one (backtest: stop8_ma20)
  near_stop_pct: 3             # warn when the close is within 3% of the stop
  trail_ma: 20                 # warn when the close falls below MA20
  heavy_drop_pct: 2            # a 2%+ down day ...
  heavy_volume_x: 2            # ... on 2x the 20-day average volume = heavy selling
  record_date_days: 15         # mention record dates in the next 15 days
  news_days: 3                 # news from the last 3 days under each position
  reentry_days: 60             # after a sell, alert when a strategy signals that stock again
  max_price_gap_pct: 15        # a price this far from the last close gets a "typo?" note

adjustments:
  # DSE resets the reference price on the record date: (P - cash) / (1 + bonus).
  # true = adjust history for cash dividends too (like DSE); false = bonus/rights only.
  adjust_cash_dividends: true

research:
  # AI review of research documents (newsflash, market review, policy reviews, company research).
  # The analyst follows config/research/ANALYST.md; sources are recognised by config/research/sources.yaml.
  model: claude-opus-5-5
  effort: high                 # low | medium | high | xhigh | max: deeper thinking costs more
  max_docs_per_review: 6
  lookback_days: 4             # default review: unreviewed documents published in the last 4 days
  max_context_stocks: 60       # StockEYE data sent for at most 60 mentioned stocks
  send_telegram: true          # send the review summary to Telegram (research review --no-send to skip)
  # api key: config/secrets.yaml (anthropic.api_key) or the ANTHROPIC_API_KEY environment variable

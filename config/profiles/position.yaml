name: position
description: 3-12 month holds. Strict on business quality.
universe: all_equities          # every active DSE equity; `ds30` for the blue chips only

filters:
  # "Good reputation, good business". Derived from the quality seed
  # (GP, BATBC, SQURPHARMA, LHB, BSC), which all pass with a margin.
  # Seed values for reference: category A, mcap >= 16,900 mn, dividend streak >= 11,
  # cash dividend 5/5 years, EPS positive 5/5 years, P/E <= 20.8, strategic holding >= 44%.
  # See `python -m dse_screener quality` for every metric; names are in quality.py METRICS.
  quality:
    enabled: true
    rules:
      category:              { in: [A] }     # default: all A-category stocks
      sector:                { not_in: [Insurance] }   # insurers report actuarially: no comparable EPS/P/E
      avg_value_mn_60:       { min: 5 }      # liquid enough to hold for months: >= BDT 5 mn/day (60-day avg)
      traded_days_pct_60:    { min: 90 }
      dividend_streak:       { min: 5 }      # consecutive years with any dividend
      cash_dividend_years_5: { min: 5 }      # cash dividend every one of the last 5 years
      eps_positive_years_5:  { min: 5 }      # profitable every one of the last 5 years
      pe:                    { max: 25 }
      strategic_pct:         { min: 25 }     # sponsor + govt; 25 keeps widely-held banks like EBL (29.4%)

  # RSI / MACD on the signal day. Metric names: see src/dse_screener/technical.py (TECH_METRICS).
  # Off: backtest 2026-10-01 found only noise-sized differences (11-31 trades per period).
  # Revisit when more history exists (see docs/02-mvp-spec.md, "Technical filter results").
  technical:
    enabled: false
    params: { rsi_window: 14, macd_fast: 12, macd_slow: 26, macd_signal: 9 }
    rules: {}

# Every number is optional: anything left out uses the default in src/dse_screener/strategies/<name>.py
strategies:
  quiet_accumulation:
    weight: 1.0
    # Optional (W6, docs/05), off: range_exclude_days, max_days_since. 2-year test: both made this worse
    # (shortlist vs basket +2.3/+1.7 -> at best +2.2/+1.3). As is: PF 2.9 / 2.7 per signal in 2025 / 2026.
    params:
      price_window_days: 90
      max_price_range_pct: 18
      vol_short_days: 20
      vol_baseline_days: 90
      min_volume_ratio: 1.5
      min_price_change_pct: -2   # a bigger dip on high volume may be selling (distribution)
      max_price_change_pct: 8
      min_divergence: 3
  base_breakout:
    weight: 0.8
    # Optional filters (W5, docs/05), off: max_dryup_ratio, follow_through_days, other base lengths.
    # 2-year test: this setup stays best (mean vs basket +2.3 / +1.7 in 2025 / 2026); dry-up leaves
    # 14 signals, 40-day bases raise recall (18% -> 29%) but drop 2025 to -0.2 vs the basket.
    params:
      base_days: 60
      max_base_range_pct: 15
      min_volume_x: 2.0
      max_days_since: 5
  second_breakout:
    # Off: 2-year check at 60d was mixed (20 signals; 2025 median -7.6% n=7, 2026 +3.3% n=13) and the
    # shortlist backtest got slightly worse (mean +3.4% -> +2.7%). Revisit with more history.
    enabled: false
    weight: 1.0
    params:
      base_days: 60            # first breakout: keep equal to base_breakout above
      max_base_range_pct: 15
      min_volume_x: 2.0
      window_days: 40
      min_rebreak_volume_x: 2.0
      max_days_since: 5
  ma_cross:
    enabled: false
    weight: 1.0
    # 20/50 golden cross with volume support (docs/06 §13); see the swing profile
    params:
      fast: 20
      slow: 50
      min_volume_ratio: 1.0
      max_days_since: 5
  big_hands:
    weight: 0.7
    # 2-year check: on its own, worse than a random day at 60 days (larger trades can be selling too).
    # Used as confirmation of the other strategies instead.
    role: confirm
    params:
      short_days: 20
      baseline_days: 90
      min_trade_size_growth: 1.3

backtest:
  horizons: [20, 60, 90]       # trading days held
  primary_horizon: 60
  cost_pct: 1.0                # round trip, %
  in_sample_until: 2025-12-31  # tune on data up to here; 2026 is the untouched test
  # Exit styles tested on the same entries as the fixed holds (stop on the intraday low, trailing MA on
  # the close, time limit counted from the signal day). Name: anything that isn't a number.
  exits:
    stop10_ma50: {stop_pct: 10, trail_ma: 50, max_days: 120}
    stop15_ma100: {stop_pct: 15, trail_ma: 100, max_days: 120}
  # Recall: a "big winner" move = close rises >= 50% within 120 trading days. Caught = a pick 20 days before
  # to 60 days after the move starts, entry <= 1.2x the starting price.
  winners: {min_gain_pct: 50, within_days: 120, before_days: 20, after_days: 60, max_entry_premium_pct: 20}

ranking:
  top_n: 10
  min_score: 40
  confluence_bonus: 10
  record_date_window_days: 30   # longer windows here, so look further around the record date
  # 0 = show the record date as a note only. 2-year check (small sample, n=18): position signals
  # near record dates did *better* (+2.4% median at 60d vs -1.2%), so no penalty here. Swing differs.
  record_date_penalty: 0
  boosts:
    - { metric: institute_change_pp, when: { min: 1.0 }, points: 5, label: "institutions adding",
        detail: "institutional holding {value:+.1f} pts" }
    - { metric: eps_cagr_3y,         when: { min: 5 },   points: 5, label: "EPS growing",
        detail: "{value:+.0f}%/yr over 3 years" }
    - { metric: dividend_yield,      when: { min: 5 },   points: 3, label: "dividend yield",
        detail: "{value:.1f}%" }

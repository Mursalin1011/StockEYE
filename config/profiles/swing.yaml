name: swing
description: 2-6 week holds. Lighter quality bar, more weight on price/volume.
universe: all_equities          # every active DSE equity; `ds30` for the blue chips only

filters:
  # Looser than `position`: a swing trade relies more on the price/volume setup,
  # but still keeps junk (Z category, loss-makers, no dividends) out.
  quality:
    enabled: true
    rules:
      category:              { in: [A] }               # default: all A-category stocks
      sector:                { not_in: [Insurance] }   # insurers report actuarially: no comparable EPS/P/E
      avg_value_mn_60:       { min: 3 }                # liquid: >= BDT 3 mn traded per day (60-day average)
      traded_days_pct_60:    { min: 90 }               # trades on at least 90% of days
      dividend_streak:       { min: 3 }
      eps_positive_years_5:  { min: 4 }
      pe:                    { max: 35 }
      strategic_pct:         { min: 25 }

  # RSI / MACD on the signal day. Metric names: see src/dse_screener/technical.py (TECH_METRICS).
  # Chosen on the DS30-only universe (docs/02-mvp-spec.md, "Technical filter results"): of ~20 RSI/MACD rules,
  # only "bullish MACD cross in the last 10 days" improved both the tuning period (2025) and the test (2026).
  # Re-check on today's 71-stock universe ("Technical filter re-check"): it now hurts the tuning period
  # (median -1.3 -> -1.6, profit factor 1.35 -> 1.09) and helps only 2026 (mean +1.7 -> +2.1, win 56% -> 59%).
  # Kept because no alternative (off, 5/15/20-day windows, more exemptions) beat it in both periods. Unproven.
  technical:
    enabled: true
    params: { rsi_window: 14, macd_fast: 12, macd_slow: 26, macd_signal: 9 }
    rules:
      days_since_macd_cross: { max: 10 }   # MACD crossed above its signal line within 10 trading days
    # A second breakout follows an earlier move up, so its MACD cross is usually older. 2-year check (71 stocks):
    # second breakouts *failing* this rule did far better (20d median +12.5% 2025 / +7.4% 2026, n=10 each)
    # than those passing it (-3.4% / +0.6%). So it doesn't apply to them.
    exempt: [second_breakout]

# Every number is optional: anything left out uses the default in src/dse_screener/strategies/<name>.py
strategies:
  quiet_accumulation:
    weight: 1.0
    params:
      price_window_days: 30
      max_price_range_pct: 12
      vol_short_days: 10
      vol_baseline_days: 40
      min_volume_ratio: 1.5
      min_price_change_pct: -2   # a bigger dip on high volume may be selling (distribution)
      max_price_change_pct: 6
      min_divergence: 3
  base_breakout:
    weight: 1.0
    params:
      base_days: 25
      max_base_range_pct: 10
      min_volume_x: 2.0
      max_days_since: 2
  second_breakout:
    weight: 1.0
    # Re-entry after a shakeout: a base breakout falls back into the base, then clears its high on volume (PTL, 12 Apr 2026).
    # 2-year check (71 stocks, 20d): 60 signals, median +3.6% vs -0.1% for first breakouts, profit factor 2.4 vs 1.6,
    # better in both 2025 and 2026. Shortlist backtest: mean +1.0% -> +1.3%, 2025 mean -0.3% -> +0.3%.
    params:
      base_days: 25            # first breakout: keep equal to base_breakout above
      max_base_range_pct: 10
      min_volume_x: 2.0
      window_days: 40          # second breakout within 40 trading days of the first
      min_rebreak_volume_x: 2.0
      max_days_since: 2
  big_hands:
    weight: 0.7
    # 2-year check: on its own, no better than a random day (larger trades can be selling too).
    # Used as confirmation of the other strategies instead.
    role: confirm
    params:
      short_days: 10
      baseline_days: 40
      min_trade_size_growth: 1.3

backtest:
  horizons: [5, 10, 20]        # trading days held
  primary_horizon: 20
  cost_pct: 1.0                # round trip, %
  in_sample_until: 2025-12-31  # tune on data up to here; 2026 is the untouched test

ranking:
  top_n: 10
  min_score: 40
  confluence_bonus: 10
  record_date_window_days: 15   # volume near a record date is dividend-driven, not accumulation
  # 2-year check: swing signals near record dates did worse (breakout -1.4% vs +2.8% median at 20d)
  record_date_penalty: 20
  boosts:
    - { metric: institute_change_pp, when: { min: 1.0 }, points: 5, label: "institutions adding",
        detail: "institutional holding {value:+.1f} pts" }
